<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可愛貪食蛇</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(circle at 15% 15%, #fff8fb 0%, transparent 25%),
        radial-gradient(circle at 85% 85%, #ffe1eb 0%, transparent 30%),
        linear-gradient(135deg, #ffdce8, #fff3f7);

    font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

    color: #805566;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================
   回首頁
========================= */

.home-link {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 20;

    padding: 9px 16px;

    border-radius: 999px;

    background: rgba(255,255,255,0.9);

    color: #9d6076;

    text-decoration: none;

    font-size: 14px;
    font-weight: bold;

    box-shadow:
        0 5px 15px rgba(180,90,120,0.15);

    transition: 0.2s;
}

.home-link:hover {
    transform: translateY(-2px);
}

/* =========================
   主畫面
========================= */

.game-wrapper {
    width: min(94vw, 620px);

    text-align: center;

    padding: 30px 15px;
}

.title {
    font-size: clamp(30px, 7vw, 46px);

    color: #e783a2;

    margin-bottom: 5px;

    letter-spacing: 2px;

    text-shadow:
        2px 3px 0 white;
}

.subtitle {
    color: #a77888;

    font-size: 14px;

    margin-bottom: 18px;
}

/* =========================
   分數
========================= */

.score-board {
    display: flex;

    justify-content: center;

    gap: 14px;

    margin-bottom: 15px;
}

.score-box {
    min-width: 120px;

    padding: 9px 18px;

    background: rgba(255,255,255,0.9);

    border: 3px solid #f4bfd0;

    border-radius: 20px;

    box-shadow:
        0 6px 15px rgba(180,90,120,0.12);
}

.score-label {
    font-size: 12px;

    color: #aa7889;
}

.score-value {
    font-size: 25px;

    font-weight: bold;

    color: #e67f9f;
}

/* =========================
   遊戲區
========================= */

.game-container {
    position: relative;

    width: min(90vw, 560px);

    aspect-ratio: 1 / 1;

    margin: auto;
}

canvas {
    width: 100%;
    height: 100%;

    display: block;

    background: #fff8fa;

    border: 6px solid #f1aec4;

    border-radius: 28px;

    box-shadow:
        0 10px 30px rgba(170,90,120,0.18),
        inset 0 0 0 3px white;

    touch-action: none;
}

/* =========================
   遊戲結束 / 暫停
========================= */

.game-over,
.pause-screen {
    position: absolute;

    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    flex-direction: column;

    background:
        rgba(255,239,245,0.94);

    border-radius: 22px;
}

.game-over.show,
.pause-screen.show {
    display: flex;
}

.overlay-icon {
    font-size: 55px;

    margin-bottom: 8px;
}

.overlay-title {
    font-size: 28px;

    font-weight: bold;

    color: #df7899;
}

.overlay-text {
    margin: 10px 0 18px;

    color: #9d7180;
}

/* =========================
   按鈕
========================= */

.restart-button {
    border: none;

    background:
        linear-gradient(
            135deg,
            #ef91ae,
            #dc7195
        );

    color: white;

    padding: 12px 28px;

    border-radius: 999px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 12px rgba(210,100,135,0.25);

    transition: 0.2s;
}

.restart-button:hover {
    transform: scale(1.04);
}

.restart-button:active {
    transform: scale(0.97);
}

/* =========================
   操作提示
========================= */

.game-tip {
    margin-top: 13px;

    font-size: 13px;

    color: #a87a89;
}

/* =========================
   手機控制
========================= */

.mobile-controls {
    display: none;

    width: 210px;

    margin: 20px auto 0;
}

.control-row {
    display: flex;

    justify-content: center;

    gap: 10px;

    margin-bottom: 10px;
}

.control-button {
    width: 58px;
    height: 50px;

    border: none;

    border-radius: 17px;

    background: white;

    color: #dc7898;

    font-size: 24px;

    font-weight: bold;

    box-shadow:
        0 5px 10px rgba(170,95,120,0.15);

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}

.control-button:active {
    transform: translateY(3px);

    box-shadow:
        0 2px 5px rgba(170,95,120,0.15);
}

.pause-button {
    width: 130px;

    font-size: 15px;
}

/* =========================
   手機版
========================= */

@media (max-width: 700px) {

    body {
        align-items: flex-start;
    }

    .game-wrapper {
        padding-top: 70px;
    }

    .home-link {
        top: 12px;
        left: 12px;

        font-size: 13px;

        padding: 8px 13px;
    }

    .mobile-controls {
        display: block;
    }

    .game-tip {
        display: none;
    }
}
</style>
</head>


<body>

<!-- 回首頁 -->
<a href="index.html" class="home-link">
    ← 回首頁
</a>


<main class="game-wrapper">

    <h1 class="title">
        🐍 貪食蛇
    </h1>

    <p class="subtitle">
        吃掉小愛心，讓蛇蛇變長吧！
    </p>


    <!-- 分數 -->
    <div class="score-board">

        <div class="score-box">

            <div class="score-label">
                目前分數
            </div>

            <div
                class="score-value"
                id="score"
            >
                0
            </div>

        </div>


        <div class="score-box">

            <div class="score-label">
                最高分
            </div>

            <div
                class="score-value"
                id="highScore"
            >
                0
            </div>

        </div>

    </div>


    <!-- 遊戲區 -->
    <div class="game-container">

        <canvas
            id="gameCanvas"
            width="500"
            height="500"
        ></canvas>


        <!-- 暫停畫面 -->
        <div
            class="pause-screen"
            id="pauseScreen"
        >

            <div class="overlay-icon">
                ⏸️
            </div>

            <div class="overlay-title">
                遊戲暫停
            </div>

            <div class="overlay-text">
                按下空白鍵繼續遊戲
            </div>

            <button
                class="restart-button"
                id="resumeButton"
            >
                繼續遊戲
            </button>

        </div>


        <!-- 遊戲結束 -->
        <div
            class="game-over"
            id="gameOver"
        >

            <div class="overlay-icon">
                💗
            </div>

            <div class="overlay-title">
                遊戲結束
            </div>

            <div class="overlay-text">

                你的分數：
                <span id="finalScore">
                    0
                </span>

            </div>

            <button
                class="restart-button"
                id="restartButton"
            >
                重新開始
            </button>

        </div>

    </div>


    <p class="game-tip">
        ↑ ↓ ← → 控制方向　｜　空白鍵 暫停
    </p>


    <!-- 手機控制 -->
    <div class="mobile-controls">

        <!-- 上 -->
        <div class="control-row">

            <button
                class="control-button"
                id="upButton"
            >
                ↑
            </button>

        </div>


        <!-- 左右 -->
        <div class="control-row">

            <button
                class="control-button"
                id="leftButton"
            >
                ←
            </button>

            <button
                class="control-button"
                id="downButton"
            >
                ↓
            </button>

            <button
                class="control-button"
                id="rightButton"
            >
                →
            </button>

        </div>


        <!-- 暫停 -->
        <div class="control-row">

            <button
                class="control-button pause-button"
                id="pauseButton"
            >
                ⏸ 暫停
            </button>

        </div>

    </div>

</main>


<script>

/* =========================
   遊戲基本設定
========================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");


const gridSize = 20;

const tileSize =
    canvas.width / gridSize;


/* =========================
   HTML 元素
========================= */

const scoreText =
    document.getElementById("score");

const highScoreText =
    document.getElementById("highScore");

const finalScoreText =
    document.getElementById("finalScore");

const gameOverScreen =
    document.getElementById("gameOver");

const pauseScreen =
    document.getElementById("pauseScreen");

const restartButton =
    document.getElementById("restartButton");

const resumeButton =
    document.getElementById("resumeButton");

const pauseButton =
    document.getElementById("pauseButton");

const upButton =
    document.getElementById("upButton");

const downButton =
    document.getElementById("downButton");

const leftButton =
    document.getElementById("leftButton");

const rightButton =
    document.getElementById("rightButton");


/* =========================
   遊戲變數
========================= */

let snake = [];

let food = {};

let direction = "right";

let nextDirection = "right";

let score = 0;

let highScore =
    Number(
        localStorage.getItem(
            "kawaiiSnakeHighScore"
        )
    ) || 0;

let gameRunning = false;

let paused = false;

let gameLoop;


/* =========================
   初始化
========================= */

function startGame() {

    snake = [

        {
            x: 10,
            y: 10
        },

        {
            x: 9,
            y: 10
        },

        {
            x: 8,
            y: 10
        }

    ];


    direction = "right";

    nextDirection = "right";


    score = 0;


    scoreText.textContent = score;

    highScoreText.textContent = highScore;


    gameRunning = true;

    paused = false;


    gameOverScreen.classList.remove(
        "show"
    );

    pauseScreen.classList.remove(
        "show"
    );


    pauseButton.textContent =
        "⏸ 暫停";


    createFood();


    clearInterval(gameLoop);


    gameLoop =
        setInterval(
            updateGame,
            130
        );


    draw();
}


/* =========================
   產生食物
========================= */

function createFood() {

    let validPosition = false;


    while (!validPosition) {

        food = {

            x:
                Math.floor(
                    Math.random() *
                    gridSize
                ),

            y:
                Math.floor(
                    Math.random() *
                    gridSize
                )
        };


        validPosition =
            !snake.some(
                part =>
                    part.x === food.x &&
                    part.y === food.y
            );
    }
}


/* =========================
   遊戲更新
========================= */

function updateGame() {

    if (
        !gameRunning ||
        paused
    ) {
        return;
    }


    /*
       把下一個方向套用到目前方向
    */

    direction =
        nextDirection;


    /*
       建立新的蛇頭
    */

    const head = {

        x: snake[0].x,

        y: snake[0].y
    };


    /* =====================
       四方向移動
    ===================== */

    if (direction === "up") {

        head.y--;

    } else if (direction === "down") {

        head.y++;

    } else if (direction === "left") {

        head.x--;

    } else if (direction === "right") {

        head.x++;
    }


    /* =====================
       撞牆
    ===================== */

    if (

        head.x < 0 ||

        head.x >= gridSize ||

        head.y < 0 ||

        head.y >= gridSize

    ) {

        endGame();

        return;
    }


    /* =====================
       撞到自己
    ===================== */

    if (

        snake.some(
            part =>
                part.x === head.x &&
                part.y === head.y
        )

    ) {

        endGame();

        return;
    }


    /*
       把新的蛇頭放到最前面
    */

    snake.unshift(head);


    /* =====================
       吃到食物
    ===================== */

    if (

        head.x === food.x &&

        head.y === food.y

    ) {

        score++;

        scoreText.textContent =
            score;


        /*
           更新最高分
        */

        if (score > highScore) {

            highScore = score;


            localStorage.setItem(
                "kawaiiSnakeHighScore",
                highScore
            );


            highScoreText.textContent =
                highScore;
        }


        createFood();

    } else {

        /*
           沒吃到食物
           移除尾巴
        */

        snake.pop();
    }


    draw();
}


/* =========================
   改變方向
========================= */

function changeDirection(newDirection) {

    if (
        !gameRunning ||
        paused
    ) {
        return;
    }


    /*
       防止蛇直接 180 度掉頭

       例如：
       向右 → 不能直接向左
       向左 → 不能直接向右
       向上 → 不能直接向下
       向下 → 不能直接向上
    */

    if (

        direction === "up" &&
        newDirection === "down"

    ) {
        return;
    }


    if (

        direction === "down" &&
        newDirection === "up"

    ) {
        return;
    }


    if (

        direction === "left" &&
        newDirection === "right"

    ) {
        return;
    }


    if (

        direction === "right" &&
        newDirection === "left"

    ) {
        return;
    }


    nextDirection =
        newDirection;
}


/* =========================
   鍵盤操作
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        /*
           上
        */

        if (
            event.key === "ArrowUp"
        ) {

            event.preventDefault();

            changeDirection("up");
        }


        /*
           下
        */

        if (
            event.key === "ArrowDown"
        ) {

            event.preventDefault();

            changeDirection("down");
        }


        /*
           左
        */

        if (
            event.key === "ArrowLeft"
        ) {

            event.preventDefault();

            changeDirection("left");
        }


        /*
           右
        */

        if (
            event.key === "ArrowRight"
        ) {

            event.preventDefault();

            changeDirection("right");
        }


        /*
           空白鍵
        */

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            togglePause();
        }

    }
);


/* =========================
   暫停
========================= */

function togglePause() {

    if (!gameRunning) {
        return;
    }


    paused = !paused;


    if (paused) {

        pauseScreen.classList.add(
            "show"
        );

        pauseButton.textContent =
            "▶ 繼續";

    } else {

        pauseScreen.classList.remove(
            "show"
        );

        pauseButton.textContent =
            "⏸ 暫停";
    }
}


/* =========================
   遊戲結束
========================= */

function endGame() {

    gameRunning = false;

    clearInterval(gameLoop);


    finalScoreText.textContent =
        score;


    gameOverScreen.classList.add(
        "show"
    );
}


/* =========================
   繪製整個畫面
========================= */

function draw() {

    /*
       清除畫面
    */

    ctx.fillStyle =
        "#fff8fa";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawBackground();

    drawFood();

    drawSnake();
}


/* =========================
   背景
========================= */

function drawBackground() {

    for (
        let y = 0;
        y < gridSize;
        y++
    ) {

        for (
            let x = 0;
            x < gridSize;
            x++
        ) {

            if (
                (x + y) % 2 === 0
            ) {

                ctx.fillStyle =
                    "rgba(255,210,225,0.25)";


                ctx.beginPath();


                ctx.arc(

                    x * tileSize +
                        tileSize / 2,

                    y * tileSize +
                        tileSize / 2,

                    2,

                    0,

                    Math.PI * 2

                );


                ctx.fill();
            }
        }
    }
}


/* =========================
   畫食物愛心
========================= */

function drawFood() {

    const centerX =
        food.x * tileSize +
        tileSize / 2;

    const centerY =
        food.y * tileSize +
        tileSize / 2;


    const size =
        tileSize * 0.30;


    ctx.save();

    ctx.translate(
        centerX,
        centerY
    );


    ctx.fillStyle =
        "#f28daa";


    ctx.beginPath();


    ctx.moveTo(
        0,
        size
    );


    ctx.bezierCurveTo(

        -size * 1.5,
        -size * 0.1,

        -size,
        -size * 1.4,

        0,
        -size * 0.5
    );


    ctx.bezierCurveTo(

        size,
        -size * 1.4,

        size * 1.5,
        -size * 0.1,

        0,
        size
    );


    ctx.fill();


    ctx.restore();
}


/* =========================
   畫蛇
========================= */

function drawSnake() {

    snake.forEach(
        (part, index) => {

            const padding = 2;


            const x =
                part.x *
                tileSize +
                padding;


            const y =
                part.y *
                tileSize +
                padding;


            const size =
                tileSize -
                padding * 2;


            /*
               蛇頭顏色
            */

            if (index === 0) {

                ctx.fillStyle =
                    "#ef89aa";

            } else {

                /*
                   身體使用兩種粉嫩色
                */

                ctx.fillStyle =
                    index % 2 === 0
                        ? "#f5abc0"
                        : "#f2a0b9";
            }


            /*
               圓角身體
            */

            roundRect(

                ctx,

                x,

                y,

                size,

                size,

                size * 0.32

            );


            ctx.fill();


            /*
               蛇頭
            */

            if (index === 0) {

                drawSnakeFace(
                    x,
                    y,
                    size
                );
            }
        }
    );
}


/* =========================
   蛇蛇臉
========================= */

function drawSnakeFace(
    x,
    y,
    size
) {

    ctx.fillStyle =
        "#704c5a";


    const eye =
        size * 0.07;


    let eye1X;
    let eye1Y;

    let eye2X;
    let eye2Y;


    /*
       根據蛇目前方向
       改變眼睛位置
    */

    if (
        direction === "right"
    ) {

        eye1X =
            x + size * 0.67;

        eye1Y =
            y + size * 0.30;

        eye2X =
            x + size * 0.67;

        eye2Y =
            y + size * 0.70;


    } else if (
        direction === "left"
    ) {

        eye1X =
            x + size * 0.33;

        eye1Y =
            y + size * 0.30;

        eye2X =
            x + size * 0.33;

        eye2Y =
            y + size * 0.70;


    } else if (
        direction === "up"
    ) {

        eye1X =
            x + size * 0.30;

        eye1Y =
            y + size * 0.33;

        eye2X =
            x + size * 0.70;

        eye2Y =
            y + size * 0.33;


    } else {

        eye1X =
            x + size * 0.30;

        eye1Y =
            y + size * 0.67;

        eye2X =
            x + size * 0.70;

        eye2Y =
            y + size * 0.67;
    }


    /*
       眼睛
    */

    ctx.beginPath();


    ctx.arc(
        eye1X,
        eye1Y,
        eye,
        0,
        Math.PI * 2
    );


    ctx.arc(
        eye2X,
        eye2Y,
        eye,
        0,
        Math.PI * 2
    );


    ctx.fill();


    /*
       小嘴巴
    */

    ctx.strokeStyle =
        "#704c5a";

    ctx.lineWidth = 1.5;

    ctx.lineCap = "round";


    ctx.beginPath();


    if (
        direction === "right"
    ) {

        ctx.arc(
            x + size * 0.82,
            y + size * 0.50,
            size * 0.08,
            0,
            Math.PI
        );


    } else if (
        direction === "left"
    ) {

        ctx.arc(
            x + size * 0.18,
            y + size * 0.50,
            size * 0.08,
            0,
            Math.PI
        );


    } else if (
        direction === "up"
    ) {

        ctx.arc(
            x + size * 0.50,
            y + size * 0.18,
            size * 0.08,
            0,
            Math.PI
        );


    } else {

        ctx.arc(
            x + size * 0.50,
            y + size * 0.82,
            size * 0.08,
            0,
            Math.PI
        );
    }


    ctx.stroke();
}


/* =========================
   圓角矩形
========================= */

function roundRect(
    context,
    x,
    y,
    width,
    height,
    radius
) {

    context.beginPath();


    context.moveTo(
        x + radius,
        y
    );


    context.lineTo(
        x + width - radius,
        y
    );


    context.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );


    context.lineTo(
        x + width,
        y + height - radius
    );


    context.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );


    context.lineTo(
        x + radius,
        y + height
    );


    context.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );


    context.lineTo(
        x,
        y + radius
    );


    context.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );


    context.closePath();
}


/* =========================
   手機按鈕
========================= */

upButton.addEventListener(
    "click",
    function() {

        changeDirection("up");

    }
);


downButton.addEventListener(
    "click",
    function() {

        changeDirection("down");

    }
);


leftButton.addEventListener(
    "click",
    function() {

        changeDirection("left");

    }
);


rightButton.addEventListener(
    "click",
    function() {

        changeDirection("right");

    }

/* =========================
